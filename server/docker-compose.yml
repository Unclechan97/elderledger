services:
  app: # Express 5 + TypeScript + SQLite
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data # elderledger.db
    env_file: .env
    # asr 模型首载慢（数分钟），不阻塞 app 启动；app 按请求惰性连接
    depends_on:
      - tts
    restart: unless-stopped

  asr: # FunASR runtime（Paraformer 离线版，CPU）
    # 镜像默认 Cmd 是 /bin/bash，必须显式起服务脚本
    # --certfile 0：关闭自签 TLS，客户端用 ws://
    # 内存紧张时可追加 --lm-dir ""（跳过语言模型，省约 1GB 内存；M2 实测再定）
    # profiles=["asr"]：默认不随 compose up 启动（机器内存有限），M2 时用
    #   docker compose --profile asr up -d 显式启动
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.0
    command: bash /workspace/FunASR/runtime/run_server.sh --certfile 0 --keyfile 0
    ports:
      - "10095:10095"
    volumes:
      - asr-models:/workspace/models # 模型缓存，避免重启重复下载（modelscope 国内源，较快）
    restart: unless-stopped
    profiles: ["asr"]

  tts: # edge-tts FastAPI 封装
    build: ./tts
    ports:
      - "55001:55001"
    restart: unless-stopped

volumes:
  asr-models:
