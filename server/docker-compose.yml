services:
  app: # Express 5 + TypeScript + MySQL
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data # 语音识别失败转储等调试文件
    env_file: .env
    depends_on:
      - mysql
    restart: unless-stopped

  mysql: # 本地开发用；云端用云托管 MySQL（MYSQL_HOST 指向内网地址）
    image: mysql:8.0
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-elderledger}
      MYSQL_DATABASE: elderledger
    ports:
      - "33061:3306" # 宿主机 3306 已被本机 MySQL 占用，仅调试用，app 走容器网络
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  asr: # FunASR runtime（Paraformer 离线版，CPU）
    # 镜像默认 Cmd 是 /bin/bash，必须显式起服务脚本
    # --certfile 0：关闭自签 TLS，客户端用 ws://
    # 内存紧张时可追加 --lm-dir ""（跳过语言模型，省约 1GB 内存；M2 实测再定）
    # profiles=["asr"]：默认不随 compose up 启动（机器内存有限），M2 时用
    #   docker compose --profile asr up -d 显式启动
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.0
    # 必须先 cd 进脚本目录：run_server.sh 以相对路径 source ../egs/...（按 CWD 解析），
    # 镜像 WORKDIR 是 /workspace，直接跑会报 parse_options.sh 不存在
    command: bash -c "cd /workspace/FunASR/runtime && bash run_server.sh --certfile 0 --keyfile 0"
    ports:
      - "10095:10095"
    volumes:
      - asr-models:/workspace/models # 模型缓存，避免重启重复下载（modelscope 国内源，较快）
    restart: unless-stopped
    profiles: ["asr"]

volumes:
  asr-models:
  mysql-data:
